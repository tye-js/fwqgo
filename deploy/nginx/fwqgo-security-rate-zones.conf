# Include in http {}, once. Resolve the real client address only from explicitly
# trusted upstream proxy CIDRs before using $binary_remote_addr for quotas.
limit_req_zone $binary_remote_addr zone=fwqgo_cms_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=fwqgo_cms_upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=fwqgo_post_views:10m rate=60r/m;
