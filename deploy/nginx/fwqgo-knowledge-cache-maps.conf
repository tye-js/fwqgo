# Include in http {}. Only an explicit application marker AND final successful
# anonymous HTML may override Next.js's default private policy for PPR documents.
map "$http_cookie$http_authorization$http_rsc$http_next_router_prefetch$http_next_router_segment_prefetch$http_next_router_state_tree$args" $fwqgo_knowledge_cache_bypass {
    default 1;
    "" 0;
}

map "$request_method:$fwqgo_knowledge_cache_bypass:$upstream_http_x_fwqgo_cacheable_knowledge:$upstream_status:$upstream_http_content_type:$upstream_http_set_cookie" $fwqgo_knowledge_cdn_cache_control {
    default "no-store";
    "~^(GET|HEAD):0:1:200:text/html(;[^:]*)?:$" "public, max-age=300, stale-while-revalidate=60";
}

map $fwqgo_knowledge_cdn_cache_control $fwqgo_knowledge_cache_control {
    default "private, no-store, max-age=0";
    # The upstream map emits only no-store or this public policy. Avoid a long
    # literal hash key that requires changing global map_hash_bucket_size.
    "~^public," "public, max-age=0, s-maxage=300, stale-while-revalidate=60";
}
