# Include inside the existing CMS HTTPS server block, after installing the
# security rate zones and fwqgo-http-tuning.conf in http {}, plus the proxy
# snippets under /etc/nginx/snippets/. Configure the CMS port in fwqgo_cms.
location ~ ^/api/auth/(login|signup)$ {
    limit_req zone=fwqgo_cms_auth burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    include /etc/nginx/snippets/fwqgo-proxy.conf;
    proxy_pass http://fwqgo_cms;
}

location = /api/upload {
    limit_req zone=fwqgo_cms_upload burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 10m;
    include /etc/nginx/snippets/fwqgo-proxy.conf;
    proxy_pass http://fwqgo_cms;
}
