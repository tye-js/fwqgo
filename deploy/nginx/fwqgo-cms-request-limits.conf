# Include inside the existing CMS HTTPS server block, after installing the
# security rate zones in http {} and snippets under /etc/nginx/snippets/.
location ~ ^/api/auth/(login|signup)$ {
    limit_req zone=fwqgo_cms_auth burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    include /etc/nginx/snippets/fwqgo-proxy-headers.conf;
    proxy_pass http://127.0.0.1:3100;
}

location = /api/upload {
    limit_req zone=fwqgo_cms_upload burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 10m;
    proxy_request_buffering on;
    include /etc/nginx/snippets/fwqgo-proxy-headers.conf;
    proxy_pass http://127.0.0.1:3100;
}
