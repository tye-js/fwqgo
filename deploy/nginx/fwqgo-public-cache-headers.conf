# Include in the existing location for /fwq/posts/* and /en/fwq/posts/* only.
# Load fwqgo-public-cache-maps.conf in http {} first. Only the application's
# anonymous canonical article marker plus a final 200 HTML response opts in.
proxy_hide_header Cache-Control;
proxy_hide_header CDN-Cache-Control;
proxy_hide_header Cloudflare-CDN-Cache-Control;
add_header Cache-Control $fwqgo_article_cache_control always;
add_header CDN-Cache-Control $fwqgo_article_cdn_cache_control always;
add_header Cloudflare-CDN-Cache-Control $fwqgo_article_cdn_cache_control always;
