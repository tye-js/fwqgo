# Include ONLY in location = /knowledge and location = /en/knowledge, keeping
# their existing proxy_pass and forwarded-host configuration. Load maps in http {}.
proxy_hide_header Cache-Control;
proxy_hide_header CDN-Cache-Control;
proxy_hide_header Cloudflare-CDN-Cache-Control;
add_header Cache-Control $fwqgo_knowledge_cache_control always;
add_header CDN-Cache-Control $fwqgo_knowledge_cdn_cache_control always;
add_header Cloudflare-CDN-Cache-Control $fwqgo_knowledge_cdn_cache_control always;
