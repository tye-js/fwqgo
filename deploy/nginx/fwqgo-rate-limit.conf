# Install explicitly through the deployment runbook. This file is not loaded by
# the application and must be validated with `nginx -t` before reload.

limit_req_zone $binary_remote_addr zone=fwqgo_network_recommend:10m rate=30r/m;

server {
    # Include this location in the public web server block.
    location = /api/network-lines/recommend {
        limit_req zone=fwqgo_network_recommend burst=10 nodelay;
        limit_req_status 429;
        limit_req_dry_run off;

        client_max_body_size 16k;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        # Only trust the configured proxy chain. Replace this explicit value
        # with the deployment's trusted edge address before installation.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Retry-After 60 always;
        proxy_pass http://127.0.0.1:3000;
    }
}
