# Include in nginx's http {} context. Install with the runbook, then nginx -t.
# The application deliberately does not set cache headers by pathname alone.
map "$http_cookie$http_authorization$http_rsc$http_next_router_prefetch$http_next_router_segment_prefetch$http_next_router_state_tree$args" $fwqgo_cache_bypass {
    default 1;
    "" 0;
}

map "$request_method:$fwqgo_cache_bypass:$upstream_http_x_fwqgo_cacheable_article:$upstream_status:$upstream_http_content_type:$upstream_http_set_cookie" $fwqgo_article_cdn_cache_control {
    default "no-store";
    "~^(GET|HEAD):0:1:200:text/html(;[^:]*)?:$" "public, max-age=900, stale-while-revalidate=86400";
}

map $fwqgo_article_cdn_cache_control $fwqgo_article_cache_control {
    default "private, no-store, max-age=0";
    # The upstream map emits only no-store or this public policy. Use a short
    # regex key so the full policy does not exceed default map hash buckets.
    "~^public," "public, max-age=0, s-maxage=900, stale-while-revalidate=86400";
}

# Public index and collection HTML (homepage, offer hub, taxonomy and archive
# pages) opts in through its own marker, so the article policy stays untouched.
map "$request_method:$fwqgo_cache_bypass:$upstream_http_x_fwqgo_cacheable_public:$upstream_status:$upstream_http_content_type:$upstream_http_set_cookie" $fwqgo_public_page_cdn_cache_control {
    default "no-store";
    "~^(GET|HEAD):0:1:200:text/html(;[^:]*)?:$" "public, max-age=900, stale-while-revalidate=86400";
}

map $fwqgo_public_page_cdn_cache_control $fwqgo_public_page_cache_control {
    default "private, no-store, max-age=0";
    # Keep the same short regex key as the article policy; see the note above.
    "~^public," "public, max-age=0, s-maxage=900, stale-while-revalidate=86400";
}
