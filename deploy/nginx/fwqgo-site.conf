# HK production site. Load fwqgo-http-tuning.conf and the existing cache/rate
# maps in http {}. Install the snippets before enabling this file.
# The current symlink is switched by the release workflow.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fwqgo.com;

    ssl_certificate /etc/letsencrypt/live/fwqgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fwqgo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/fwqgo-security-headers.conf;
    include /etc/nginx/snippets/fwqgo-public-request-limits.conf;

    client_max_body_size 20M;
    client_body_buffer_size 256k;
    client_body_timeout 60s;

    location /_next/static/ {
        alias /var/www/fwqgo/current/.next-web/static/;
        include /etc/nginx/snippets/fwqgo-static-headers.conf;
    }

    # Serve only real images from /uploads/, and 404 everything else.
    #
    # Scanners probe this path; when the upload endpoint is bypassed they can
    # leave files such as `config_fwq.php` or `123.jpg.fuckok123`. Those are
    # already inert (octet-stream + nosniff, no fastcgi_pass), but while they
    # exist the domain doubles as free hosting for a PHP webshell. The upload
    # endpoint itself forces `.webp` / `.gif`; this is the belt-and-braces
    # layer for what is already on disk.
    #
    # Implementation notes — both were verified on this host before being
    # committed, because getting them wrong silently breaks every cover:
    #   * `root /var/www` (NOT `alias /var/www/uploads/`): in a regex location
    #     `alias` resolves the path wrongly — with `try_files` every image 404s,
    #     without it every image 301s.
    #   * the trailing `location /uploads/ { return 404; }` must stay, so
    #     non-image requests do not fall through to the proxy.
    location ~ ^/uploads/.*\.(?:webp|gif|jpe?g|png|avif|ico|svg)$ {
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
        add_header Access-Control-Allow-Origin "https://fwqgo.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        expires 7d;
        add_header Cache-Control "public, no-transform";
        root /var/www;
        try_files $uri =404;
    }

    location /uploads/ {
        # Not an image. Keep the hardening headers so a probe still sees them,
        # but do not serve the bytes.
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
        return 404;
    }

    location ~ ^/(?:en/)?fwq/posts/ {
        proxy_pass http://fwqgo_web;
        include /etc/nginx/snippets/fwqgo-proxy.conf;
        include /etc/nginx/snippets/fwqgo-public-cache-headers.conf;
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
    }

    location = /knowledge {
        proxy_pass http://fwqgo_web;
        include /etc/nginx/snippets/fwqgo-proxy.conf;
        include /etc/nginx/snippets/fwqgo-knowledge-cache-headers.conf;
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
    }

    location = /en/knowledge {
        proxy_pass http://fwqgo_web;
        include /etc/nginx/snippets/fwqgo-proxy.conf;
        include /etc/nginx/snippets/fwqgo-knowledge-cache-headers.conf;
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
    }

    # Public index HTML. Exact matches win over every prefix and regex location,
    # so the homepage and the offer hub get the shared-cache policy without
    # widening location /, which also serves sitemap, robots, feed and image
    # responses that carry their own policies.
    location = / {
        proxy_pass http://fwqgo_web;
        include /etc/nginx/snippets/fwqgo-proxy.conf;
        include /etc/nginx/snippets/fwqgo-public-page-cache-headers.conf;
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
    }

    location = /en {
        proxy_pass http://fwqgo_web;
        include /etc/nginx/snippets/fwqgo-proxy.conf;
        include /etc/nginx/snippets/fwqgo-public-page-cache-headers.conf;
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
    }

    location = /servers {
        proxy_pass http://fwqgo_web;
        include /etc/nginx/snippets/fwqgo-proxy.conf;
        include /etc/nginx/snippets/fwqgo-public-page-cache-headers.conf;
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
    }

    location / {
        proxy_pass http://fwqgo_web;
        include /etc/nginx/snippets/fwqgo-proxy.conf;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Server collection pages and taxonomy/archive listings. These stay below
    # the dotfile deny above: regex locations are matched in order, so a path
    # such as /servers/.env still hits `deny all` first.
    location ~ ^/servers/ {
        proxy_pass http://fwqgo_web;
        include /etc/nginx/snippets/fwqgo-proxy.conf;
        include /etc/nginx/snippets/fwqgo-public-page-cache-headers.conf;
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
    }

    location ~ ^/(?:en/)?fwq/(?:page/[^/]+|(?:tags/)?[^/]+/page/[^/]+)$ {
        proxy_pass http://fwqgo_web;
        include /etc/nginx/snippets/fwqgo-proxy.conf;
        include /etc/nginx/snippets/fwqgo-public-page-cache-headers.conf;
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
    }

    access_log /var/log/nginx/fwqgo.access.log fwqgo_timing buffer=128k flush=5s;
    error_log /var/log/nginx/fwqgo.error.log warn;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.fwqgo.com;

    ssl_certificate /etc/letsencrypt/live/fwqgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fwqgo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/fwqgo-security-headers.conf;
    include /etc/nginx/snippets/fwqgo-cms-request-limits.conf;

    client_max_body_size 20M;
    client_body_buffer_size 256k;
    client_body_timeout 60s;

    location /_next/static/ {
        alias /var/www/fwqgo/current/.next-cms/static/;
        include /etc/nginx/snippets/fwqgo-static-headers.conf;
    }

    # Same image-only guard as the web server block; see the notes there for why
    # it uses `root` rather than `alias`. The CMS also serves uploaded covers.
    location ~ ^/uploads/.*\.(?:webp|gif|jpe?g|png|avif|ico|svg)$ {
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
        add_header Access-Control-Allow-Origin "https://cms.fwqgo.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        expires 7d;
        add_header Cache-Control "public, no-transform";
        root /var/www;
        try_files $uri =404;
    }

    location /uploads/ {
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
        return 404;
    }

    location / {
        proxy_pass http://fwqgo_cms;
        include /etc/nginx/snippets/fwqgo-proxy.conf;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/fwqgo-cms.access.log fwqgo_timing buffer=128k flush=5s;
    error_log /var/log/nginx/fwqgo-cms.error.log warn;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fwqgo.com;

    ssl_certificate /etc/letsencrypt/live/fwqgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fwqgo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/fwqgo-security-headers.conf;
    return 301 https://fwqgo.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name fwqgo.com www.fwqgo.com;
    return 301 https://fwqgo.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name cms.fwqgo.com;
    return 301 https://cms.fwqgo.com$request_uri;
}
