# HK production site. Load fwqgo-http-tuning.conf and the existing cache/rate
# maps in http {}. Install the snippets before enabling this file.
# The current symlink is switched by the release workflow.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fwqgo.com;

    ssl_certificate /etc/letsencrypt/live/fwqgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fwqgo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/fwqgo-security-headers.conf;
    include /etc/nginx/snippets/fwqgo-public-request-limits.conf;

    client_max_body_size 20M;
    client_body_buffer_size 256k;
    client_body_timeout 60s;

    location /_next/static/ {
        alias /var/www/fwqgo/current/.next-web/static/;
        include /etc/nginx/snippets/fwqgo-static-headers.conf;
    }

    location /uploads/ {
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
        add_header Access-Control-Allow-Origin "https://fwqgo.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
        if ($request_method = OPTIONS) {
            include /etc/nginx/snippets/fwqgo-security-headers.conf;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        expires 7d;
        add_header Cache-Control "public, no-transform";
        alias /var/www/uploads/;
        try_files $uri =404;
    }

    location ~ ^/(?:en/)?fwq/posts/ {
        proxy_pass http://fwqgo_web;
        include /etc/nginx/snippets/fwqgo-proxy.conf;
        include /etc/nginx/snippets/fwqgo-public-cache-headers.conf;
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
    }

    location = /knowledge {
        proxy_pass http://fwqgo_web;
        include /etc/nginx/snippets/fwqgo-proxy.conf;
        include /etc/nginx/snippets/fwqgo-knowledge-cache-headers.conf;
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
    }

    location = /en/knowledge {
        proxy_pass http://fwqgo_web;
        include /etc/nginx/snippets/fwqgo-proxy.conf;
        include /etc/nginx/snippets/fwqgo-knowledge-cache-headers.conf;
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
    }

    location / {
        proxy_pass http://fwqgo_web;
        include /etc/nginx/snippets/fwqgo-proxy.conf;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/fwqgo.access.log fwqgo_timing buffer=128k flush=5s;
    error_log /var/log/nginx/fwqgo.error.log warn;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.fwqgo.com;

    ssl_certificate /etc/letsencrypt/live/fwqgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fwqgo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/fwqgo-security-headers.conf;
    include /etc/nginx/snippets/fwqgo-cms-request-limits.conf;

    client_max_body_size 20M;
    client_body_buffer_size 256k;
    client_body_timeout 60s;

    location /_next/static/ {
        alias /var/www/fwqgo/current/.next-cms/static/;
        include /etc/nginx/snippets/fwqgo-static-headers.conf;
    }

    location /uploads/ {
        include /etc/nginx/snippets/fwqgo-security-headers.conf;
        add_header Access-Control-Allow-Origin "https://cms.fwqgo.com" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
        if ($request_method = OPTIONS) {
            include /etc/nginx/snippets/fwqgo-security-headers.conf;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        expires 7d;
        add_header Cache-Control "public, no-transform";
        alias /var/www/uploads/;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://fwqgo_cms;
        include /etc/nginx/snippets/fwqgo-proxy.conf;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/fwqgo-cms.access.log fwqgo_timing buffer=128k flush=5s;
    error_log /var/log/nginx/fwqgo-cms.error.log warn;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fwqgo.com;

    ssl_certificate /etc/letsencrypt/live/fwqgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fwqgo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/fwqgo-security-headers.conf;
    return 301 https://fwqgo.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name fwqgo.com www.fwqgo.com;
    return 301 https://fwqgo.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name cms.fwqgo.com;
    return 301 https://cms.fwqgo.com$request_uri;
}
