# Include ONLY in the public index/collection locations (homepage, offer hub,
# taxonomy and archive). Load fwqgo-public-cache-maps.conf in http {} first.
# Only the application's anonymous canonical marker plus a final 200 HTML
# response opts in; every other response in these locations stays no-store.
proxy_hide_header Cache-Control;
proxy_hide_header CDN-Cache-Control;
proxy_hide_header Cloudflare-CDN-Cache-Control;
add_header Cache-Control $fwqgo_public_page_cache_control always;
add_header CDN-Cache-Control $fwqgo_public_page_cdn_cache_control always;
add_header Cloudflare-CDN-Cache-Control $fwqgo_public_page_cdn_cache_control always;
