# Include only for Next.js build assets under /_next/static/.
include /etc/nginx/snippets/fwqgo-security-headers.conf;
add_header Cache-Control $fwqgo_static_cache_control always;
open_file_cache max=5000 inactive=30s;
open_file_cache_valid 15s;
open_file_cache_min_uses 2;
# A missing asset can appear after a release switch; never cache lookup errors.
open_file_cache_errors off;
