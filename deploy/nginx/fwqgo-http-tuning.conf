# Include once in http {}. The ports and release paths match the HK host.
map $http_upgrade $fwqgo_connection_upgrade {
    default upgrade;
    "" "";
}

upstream fwqgo_web {
    server 127.0.0.1:3000;
    keepalive 32;
    # Stay below Next/Bun's default five-second idle connection timeout.
    keepalive_timeout 4s;
    keepalive_requests 1000;
}

upstream fwqgo_cms {
    server 127.0.0.1:3100;
    keepalive 16;
    keepalive_timeout 4s;
    keepalive_requests 1000;
}

map $status $fwqgo_static_cache_control {
    default "no-store";
    200 "public, max-age=31536000, immutable";
    206 "public, max-age=31536000, immutable";
    304 "public, max-age=31536000, immutable";
}

# Keep the combined-log fields for existing readers; append timing information.
log_format fwqgo_timing '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       'rt=$request_time uct=$upstream_connect_time '
                       'uht=$upstream_header_time urt=$upstream_response_time';

# nginx.conf enables gzip. Leave SSE and already-compressed images/fonts out.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 4;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript text/x-component
           application/json application/javascript application/xml
           application/rss+xml application/atom+xml application/manifest+json
           image/svg+xml font/otf font/ttf;
