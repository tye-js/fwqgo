# Include in every location that proxies to the named Web/CMS upstreams.
include /etc/nginx/snippets/fwqgo-proxy-headers.conf;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $fwqgo_connection_upgrade;
# Compress at Nginx so Bun can send the original response stream.
proxy_set_header Accept-Encoding "";
proxy_socket_keepalive on;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_request_buffering on;
# Preserve Next.js PPR/RSC and event-stream delivery.
proxy_buffering off;
proxy_buffer_size 32k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 64k;

# Nginx supplies these headers for proxied and static responses alike.
# Keep Next.js's CSP: its resource directives complement our base restrictions.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Permissions-Policy;
