# Include in the public HTTPS server block. This API must not inherit any
# public HTML cache policy. Adjust the upstream if WEB_PORT is not 3000.
location ~ ^/api/posts/[^/]+/view$ {
    limit_req zone=fwqgo_post_views burst=15 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    include /etc/nginx/snippets/fwqgo-proxy-headers.conf;
    proxy_pass http://127.0.0.1:3000;
}
