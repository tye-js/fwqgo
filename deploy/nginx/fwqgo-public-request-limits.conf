# Include in the public HTTPS server block. This API must not inherit any
# public HTML cache policy. Load fwqgo-http-tuning.conf in http {} first.
# Configure the Web port in that file's fwqgo_web upstream.
location ~ ^/api/posts/[^/]+/view$ {
    limit_req zone=fwqgo_post_views burst=15 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    include /etc/nginx/snippets/fwqgo-proxy.conf;
    proxy_pass http://fwqgo_web;
}
